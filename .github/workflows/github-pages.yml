# Publica o site no GitHub Pages a cada push na main,
# copiando os arquivos do site para a branch gh-pages (fonte do Pages).
# Endereço: https://r0s3nd0.github.io/Roteiro-2027-Europa/
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualiza a branch gh-pages
        run: |
          mkdir -p /tmp/site
          cp -r index.html css js sw.js manifest.webmanifest icon.svg /tmp/site/
          touch /tmp/site/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          git rm -rq --ignore-unmatch .
          cp -r /tmp/site/. .
          git add -A
          git diff --cached --quiet && { echo "Nada mudou."; exit 0; }
          git commit -m "Publica ${GITHUB_SHA::7}"
          git push origin gh-pages
