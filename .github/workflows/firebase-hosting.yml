# Publica o site no Firebase Hosting a cada push na main.
# Configuração (uma vez só), em GitHub → Settings → Secrets and variables → Actions:
#   - Secret   FIREBASE_SERVICE_ACCOUNT : JSON da conta de serviço do projeto Firebase
#   - Variable FIREBASE_PROJECT_ID      : ID do projeto (ex.: roteiro-europa-2027)
name: Deploy no Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
